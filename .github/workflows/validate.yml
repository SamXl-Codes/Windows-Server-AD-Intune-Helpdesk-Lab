name: Validate offline lab demos
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 12 offline ticket tests and preserve genuine output
        shell: bash
        run: |
          mkdir -p evidence-ci
          python -m unittest discover -s tests -v 2>&1 | tee evidence-ci/python-test-results.txt
      - name: Build real offline demo report from fictional tickets
        shell: bash
        run: |
          python -m labtools report --file sample-data/tickets.csv --as-of 2026-11-26T12:00:00+00:00 --html evidence-ci/demo.html | tee evidence-ci/synthetic-ticket-cli.txt
          grep -q 'SYNTHETIC HELP DESK DEMO' evidence-ci/synthetic-ticket-cli.txt
      - name: Verify diagram and screenshot assets exist
        shell: bash
        run: |
          test -s assets/architecture.svg
          test -s assets/workflow.svg
          test -s assets/screenshots/synthetic-ticket-dashboard.png
          test -s assets/screenshots/synthetic-ticket-cli.png
      - name: Upload reproducible offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-ticket-analysis-evidence
          path: evidence-ci/
          if-no-files-found: warn
          retention-days: 30
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts without executing them
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) { $errors | Format-Table; throw 'PowerShell parsing failed.' }
      - name: Run non-operative AD user provisioning preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence-ci -Force | Out-Null
          $preview = & .\scripts\Invoke-LabUserProvisioning.ps1 -CsvPath .\configs\sample-users.csv 6>&1 | Out-String
          $preview | Set-Content -Encoding utf8 evidence-ci/ad-provisioning-preview.txt
          Write-Host $preview
          if ($preview -notmatch 'PREVIEW ONLY: 3' -or $preview -notmatch 'No directory changes were attempted') {
            throw 'Safe preview missing expected dry-run output.'
          }
      - name: Upload PowerShell dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-dry-run-evidence
          path: evidence-ci/
          if-no-files-found: warn
          retention-days: 30
